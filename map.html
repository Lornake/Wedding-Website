<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Xanh+Mono:ital@0;1&family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="assets/css/style.css?v=2" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">Kayla &amp; Lorenzo</a>
    <nav class="primary-nav">
      <a href="map.html" class="nav-link active">Map</a>
      <a href="calendar.html" class="nav-link">Calendar</a>
      <a href="faq.html" class="nav-link">FAQ</a>
      <a href="rsvp.html" class="nav-link">RSVP</a>
      <a href="instructions.html" class="nav-link">Instructions</a>
      <a href="registry.html" class="nav-link">Registry</a>
    </nav>
  </div>
</header>

<main>
  <div class="map-layout wrap">
    <aside class="map-sidebar">
      <div class="map-tabs" id="map-tabs" role="tablist" aria-label="Location categories">
        <!-- populated by map-init.js from CATEGORY_ORDER -->
      </div>
      <div class="map-stop-list" id="map-stop-list">
        <!-- populated by map-init.js for the active category -->
      </div>
    </aside>

    <div class="map-main">
      <div class="map-shell">
        <div id="map"></div>
      </div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/js/map-config.js?v=3"></script>
<script src="assets/js/map-init.js?v=3"></script>
</body>
</html>
