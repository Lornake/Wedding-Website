<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Map — Puglia, Late September</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 L20 11 L20 22 L4 22 L4 11 Z" fill="#a4502b"/>
        <circle cx="12" cy="6" r="1.4" fill="#f7f6f1"/>
      </svg>
      Puglia, Late September
    </a>
    <nav class="primary-nav">
      <a href="map.html" class="nav-link active">Map</a>
      <a href="itinerary.html" class="nav-link">Itinerary</a>
      <a href="about.html" class="nav-link">About</a>
    </nav>
  </div>
</header>

<main>
  <div class="map-layout wrap">
    <aside class="map-sidebar">
      <div class="map-tabs" id="map-tabs" role="tablist" aria-label="Location categories">
        <!-- populated by map-init.js from CATEGORY_ORDER -->
      </div>
      <div class="map-stop-list" id="map-stop-list">
        <!-- populated by map-init.js for the active category -->
      </div>
    </aside>

    <div class="map-main">
      <div class="map-shell">
        <div id="map"></div>
      </div>
      <div class="map-note" id="map-key-warning" style="display:none;">
        No Google Maps API key is set yet. Open <code>assets/js/map-config.js</code> and replace
        <code>YOUR_API_KEY_HERE</code> with your own key — see <code>README.md</code> for how to get one for free.
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>Puglia, Late September</span>
    <span>Built for the trip, not for anyone else.</span>
  </div>
</footer>

<script src="assets/js/nav.js"></script>
<script src="assets/js/map-config.js"></script>
<script src="assets/js/map-init.js"></script>
<script>
  if (typeof GOOGLE_MAPS_API_KEY === "undefined" || GOOGLE_MAPS_API_KEY === "YOUR_API_KEY_HERE") {
    document.getElementById("map-key-warning").style.display = "block";
    document.getElementById("map").innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:var(--font-mono);color:#1c2b33;text-align:center;padding:24px;">Add your Google Maps API key in assets/js/map-config.js to load the map here.</div>';

    // Still build the tabs + list so you can preview the layout without a key.
    const tabsEl = document.getElementById("map-tabs");
    CATEGORY_ORDER.forEach((cat, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "map-tab" + (i === 0 ? " active" : "");
      btn.textContent = CATEGORY_LABELS[cat] || cat;
      btn.style.setProperty("--tab-color", CATEGORY_COLORS[cat] || "#1c2b33");
      btn.addEventListener("click", () => {
        document.querySelectorAll(".map-tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderFallbackList(cat);
      });
      tabsEl.appendChild(btn);
    });

    function renderFallbackList(category) {
      const listEl = document.getElementById("map-stop-list");
      listEl.innerHTML = "";
      TRIP_STOPS.filter((s) => s.category === category).forEach((stop) => {
        const item = document.createElement("div");
        item.className = "map-stop-item";
        item.style.setProperty("--stop-color", CATEGORY_COLORS[stop.category] || "#1c2b33");
        item.innerHTML = `<span class="map-stop-dot"></span><span class="map-stop-text"><span class="map-stop-name">${stop.name}</span><span class="map-stop-note">${stop.note || ""}</span></span>`;
        listEl.appendChild(item);
      });
    }

    renderFallbackList(CATEGORY_ORDER[0]);
  } else {
    const script = document.createElement("script");
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=marker&callback=initTripMap&v=weekly`;
    script.async = true;
    document.head.appendChild(script);
  }
</script>
</body>
</html>
