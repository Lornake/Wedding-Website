name: Build content from docx

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/build_content.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install Python dependencies
        run: pip install beautifulsoup4

      - name: Build faq.html
        run: python3 scripts/build_content.py content/faq.docx faq.html

      - name: Build instructions.html
        run: python3 scripts/build_content.py content/instructions.docx instructions.html

      - name: Commit generated HTML if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add faq.html instructions.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-build faq.html / instructions.html from docx [skip ci]"
            git push
          fi
