<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon</title>
<meta name="description" content="This site is a work in progress. Leave your email to be notified when it's ready." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=2" />
<link rel="stylesheet" href="assets/css/landing.css?v=2" />
</head>
<body class="landing-body">

<div class="lang-toggle" role="group" aria-label="Language">
  <button type="button" class="lang-btn active" data-lang="en" aria-pressed="true" aria-label="English">
    <svg viewBox="0 0 24 16" width="26" height="18"><g>
      <rect width="24" height="16" fill="#B22234"/>
      <g fill="#fff"><rect y="1.23" width="24" height="1.23"/><rect y="3.69" width="24" height="1.23"/><rect y="6.15" width="24" height="1.23"/><rect y="8.62" width="24" height="1.23"/><rect y="11.08" width="24" height="1.23"/><rect y="13.54" width="24" height="1.23"/></g>
      <rect width="10" height="8.62" fill="#3C3B6E"/>
    </g></svg>
  </button>
  <button type="button" class="lang-btn" data-lang="it" aria-pressed="false" aria-label="Italiano">
    <svg viewBox="0 0 24 16" width="26" height="18">
      <rect width="8" height="16" fill="#009246"/>
      <rect x="8" width="8" height="16" fill="#fff"/>
      <rect x="16" width="8" height="16" fill="#CE2B37"/>
    </svg>
  </button>
</div>

<main class="coming-soon">
  <div class="coming-soon-image-wrap">
    <img src="assets/img/wip-hero.webp" alt="Kittens exploring the inside of an open desktop computer" class="coming-soon-image" />
  </div>

  <div class="coming-soon-content wrap">
    <h1 class="ruby-text" data-i18n="wip">Work in progress</h1>
    <p class="coming-soon-prompt" data-i18n="prompt">Please put your email in the box below to be notified when the website is done.</p>

    <form id="notify-form" class="notify-form" novalidate>
      <input
        type="email"
        id="notify-email"
        name="email"
        class="notify-input"
        data-i18n-placeholder="emailPlaceholder"
        placeholder="you@example.com"
        required
        autocomplete="email"
      />
      <button type="submit" class="btn btn-primary notify-submit" data-i18n="submit">Notify me</button>
    </form>
    <p id="notify-status" class="notify-status" role="status" aria-live="polite"></p>

    <label class="premium-box">
      <input type="checkbox" id="premium-checkbox" class="premium-checkbox" />
      <span class="premium-checkmark" aria-hidden="true"></span>
      <span class="premium-label" data-i18n="premium">Premium subscription</span>
    </label>
  </div>
</main>

<aside id="sneak-peek-panel" class="sneak-peek-panel" aria-hidden="true">
  <button type="button" id="sneak-peek-close" class="sneak-peek-close" aria-label="Close">&times;</button>
  <p class="sneak-peek-eyebrow" data-i18n="sneakEyebrow">You found something</p>
  <h2 class="sneak-peek-title" data-i18n="sneakTitle">The map's already live</h2>
  <p class="sneak-peek-text" data-i18n="sneakText">The venue, sights, and stops for the trip — have a look while the rest of the site catches up.</p>
  <a href="map.html" class="btn btn-primary sneak-peek-link" data-i18n="sneakLink">Open the map →</a>
</aside>

<script src="assets/js/site-config.js?v=2"></script>
<script src="assets/js/landing.js?v=2"></script>
</body>
</html>
